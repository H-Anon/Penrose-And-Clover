<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width">

<link href="https://fonts.googleapis.com/css2?family=Merriweather&display=swap" rel="stylesheet"/>

<title>ⲫⲛⲟⲩϯ</title>

<style>
/* =====================
   Base / Background
===================== */
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

.background {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

/* =====================
   Penrose CSS
===================== */
.penrose {
  width: 4em;
  height: 4em;
  position: absolute;
  top: 0;
  color: hsl(0, 100%, 60%);
  animation: fallAndRotate linear infinite;
  transform-origin: 66% 66%;
  opacity: 0;

  /* mouse layer */
  --mx: 0px;
  --my: 0px;
  --r: 0deg;
  transform:
    translate(var(--mx), var(--my))
    rotate(var(--r));
  will-change: transform;
}

.penrose div {
  position: absolute;
  width: 100%;
  height: 100%;
  background-color: currentColor;
  clip-path: polygon(63% 0, 75% 0, 26% 85%, 89.5% 85%, 98.4% 100%, 0 100%);
  transform: rotate(calc((var(--n) - 1) * 120deg));
  filter: brightness(calc(1 - (var(--n) - 1) * 0.33));
}

.penrose div:nth-child(1){--n:1;}
.penrose div:nth-child(2){--n:2;top:18.3%;left:43.3%;}
.penrose div:nth-child(3){--n:3;top:46.5%;left:5.9%;}

@keyframes fallAndRotate {
  0%   { transform: translateY(-120px) rotate(0deg); opacity: 0; }
  10%  { opacity: 1; }
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

/* =====================
   Clover CSS
===================== */
#apila-template {
  display: none;
  position: absolute;
  width: 2em;
  height: 2em;
}

#apila-template > div {
  position: absolute;
  width: 50%;
  height: 50%;
  border-radius: 50%;
  background-color: var(--green);
}

#apila-template #main-square {
  width: 100%;
  height: 100%;
  border-radius: 0;
}

#apila-template .stem {
  position: absolute;
  width: 0.3em;
  height: 1.2em;
  top: 100%;
  left: 50%;
  transform: translateX(-50%) rotate(15deg);
  background: linear-gradient(to bottom, var(--green) 70%, transparent 100%);
  opacity: 0.7;
}

#apila-template .leaf1-left { left: -25%; }
#apila-template .leaf1-right { top: -25%; }
#apila-template .leaf2-left { right: 0; top: -25%; }
#apila-template .leaf2-right { right: -25%; }
#apila-template .leaf3-left { right: -25%; bottom: 0; }
#apila-template .leaf3-right { right: 0; bottom: -25%; }
#apila-template .leaf4-left { bottom: -25%; }
#apila-template .leaf4-right { bottom: 0; left: -25%; }

.apila {
  position: fixed;
  width: 2em;
  height: 2em;
  pointer-events: none;
  opacity: 0;
  animation: fallAndRotate linear infinite;

  /* mouse layer */
  --mx: 0px;
  --my: 0px;
  --r: 0deg;
  transform:
    translate(var(--mx), var(--my))
    rotate(var(--r));
  will-change: transform;
}

/* =====================
   Animations
===================== */
@keyframes apilaFloat {
  0%   { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
  10%  { opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
</style>
</head>

<body>

<div class="background"></div>

<!-- Clover Template -->
<div id="apila-template">
  <div id="main-square"></div>
  <div class="leaf1-left"></div>
  <div class="leaf1-right"></div>
  <div class="leaf2-left"></div>
  <div class="leaf2-right"></div>
  <div class="leaf3-left"></div>
  <div class="leaf3-right"></div>
  <div class="leaf4-left"></div>
  <div class="leaf4-right"></div>
  <div class="stem"></div>
</div>

<script>
/* =====================
   Penrose Creation
===================== */
const numberOfShapes = 90;

for (let i = 0; i < numberOfShapes; i++) {
  const penrose = document.createElement('div');
  penrose.classList.add('penrose');
  penrose.style.left = Math.random() * 100 + 'vw';
  penrose.style.animationDuration = 10 + Math.random() * 10 + 's';
  penrose.style.animationDelay = Math.random() * 10 + 's';
  penrose.style.color = `hsl(${Math.random() * 360}, 100%, 60%)`;

  for (let j = 0; j < 3; j++) {
    penrose.appendChild(document.createElement('div'));
  }

  document.body.appendChild(penrose);
}

/* =====================
   Clover Creation
===================== */
window.onload = () => {
  const container = document.querySelector('.background');
  const template = document.getElementById('apila-template');

  for (let i = 0; i < 90; i++) {
    const apila = template.cloneNode(true);
    apila.style.display = 'block';
    apila.classList.add('apila');
    apila.style.left = Math.random() * 100 + 'vw';
    apila.style.top = (-10 - Math.random() * 10) + 'vh';

    const lightness = 40 + Math.random() * 30;
    apila.style.setProperty('--green', `hsl(130, 70%, ${lightness}%)`);

    const duration = 10 + Math.random() * 15;
    apila.style.animationDuration = duration + 's';
    apila.style.animationDelay = Math.random() * duration + 's';

    container.appendChild(apila);
  }
};

let mouseX = innerWidth / 2;
let mouseY = innerHeight / 2;
let smoothX = mouseX;
let smoothY = mouseY;

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

const reactives = [];

function registerReactives() {
  document.querySelectorAll('.penrose, .apila').forEach(el => {
    reactives.push({
      el,
      strength: 35 + Math.random() * 45, // MUCH stronger
      rot: (Math.random() - 0.5) * 40
    });
  });
}

function animate() {
  /* cursor inertia */
  smoothX += (mouseX - smoothX) * 0.15;
  smoothY += (mouseY - smoothY) * 0.15;

  reactives.forEach(o => {
    const r = o.el.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    const dx = smoothX - cx;
    const dy = smoothY - cy;
    const dist = Math.hypot(dx, dy) + 0.001;

    /* magnetic force curve */
    const force =
      Math.pow(Math.min(600 / dist, 2.5), 2);

    const x = (dx / dist) * force * o.strength;
    const y = (dy / dist) * force * o.strength;

    o.el.style.setProperty('--mx', `${x}px`);
    o.el.style.setProperty('--my', `${y}px`);
    o.el.style.setProperty('--r', `${o.rot * force}deg`);
  });

  requestAnimationFrame(animate);
}

setTimeout(() => {
  registerReactives();
  animate();
}, 100);
</script>

</body>
</html>
